<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['[', ']']] },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
};

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
:root{--nd:#133565;--nb:#215CAF;--cl:#50AAD7;--go:#C69214;--tx:#3C3C3C;--bg:#F5F7FA;--ln:#D8DEE8}
*{box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;line-height:1.6;max-width:880px;margin:0 auto;padding:15px;background:var(--bg);color:var(--tx)}
h1,h2,h3,h4{text-align:center;color:var(--nd);margin:10px 0}
.review-banner{background:#c53030;color:white;text-align:center;padding:12px;font-weight:bold;position:sticky;top:0;z-index:1000;border-radius:6px;margin-bottom:20px;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.sec{background:var(--nd);color:#fff;padding:12px 18px;border-radius:8px;margin:28px 0 12px;font-weight:bold;border-bottom:4px solid var(--go);font-size:1.1rem}
.question{margin-bottom:20px;padding:18px;background:#fff;border-radius:8px;border-left:5px solid var(--nb);box-shadow:0 1px 4px rgba(19,53,101,.08)}
.question .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--nd);margin-bottom:8px}
.pts{color:var(--go);font-weight:bold;white-space:nowrap;font-size:1.05rem}
.breakdown{font-size:0.88rem;color:#55707d;background:#e3f3f5;padding:6px 12px;border-radius:6px;margin:6px 0 12px;border-left:3px solid var(--nb)}
.correct{background:#d9f2e0!important;border-left-color:#2f855a!important}
.partial{background:#FBF3E1!important;border-left-color:var(--go)!important}
.incorrect{background:#fde0e0!important;border-left-color:#c53030!important}
label.option{display:block;margin:8px 0;padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
label.option:hover{background:#edf2f7;border-color:var(--ln)}
canvas{width:100%;max-width:600px;height:auto;background:#fff;border:1px solid var(--ln);border-radius:8px;display:block;margin:12px 0}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:8px 0;font-size:.95rem}
.ans{width:110px;padding:6px 8px;border:1px solid var(--nb);border-radius:6px;font:inherit}
.mut{color:#6b7a90;font-size:.9rem}
.act{padding:8px 16px;font-size:1rem;margin:0;background:var(--nb);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
.act.alt{background:#e3f3f5;color:var(--nd);border:1px solid var(--nb)}
.act:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;padding:8px 16px;margin:6px;background:var(--nd);color:#fff;border-radius:6px;cursor:grab;font-weight:bold;font-size:1.05rem;user-select:none}
.chip.sel{outline:3px solid var(--go)}
.blank{display:inline-block;min-width:85px;min-height:40px;border:2px dashed var(--nb);border-radius:6px;vertical-align:middle;padding:4px 8px;background:#fff;text-align:center;line-height:30px}
.pool{padding:12px;border:1px dashed var(--ln);border-radius:8px;min-height:48px;margin-bottom:12px;background:#f9fbfd}
.stm{margin:10px 0;font-size:1.05rem}
.scaffold-box{background:#f4f8fb;border:1px solid var(--cl);border-radius:6px;padding:10px 14px;margin:10px 0;font-size:0.92rem;color:var(--nd)}
.canvas-desc{font-size:0.88rem;color:#4a5568;background:#edf2f7;padding:6px 10px;border-radius:6px;margin-top:6px;display:inline-block}
.big{padding:15px;font-size:1.15rem;cursor:pointer;border-radius:6px;border:none;font-weight:bold;width:100%;margin-top:15px;color:#fff;background:var(--nd)}
#report-card{display:none;background:#EAF3FB;border:2px solid var(--nb);border-radius:10px;padding:25px;margin:20px 0;text-align:center}
.rm{font-size:1.15rem;margin:8px 0;color:var(--nd)}

/* REVIEW PANEL STYLES */
.review-panel{background:#fff;border:2px solid var(--go);border-radius:8px;padding:20px;margin-top:30px}
.rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rev-grid input,.rev-grid select,.review-panel textarea{width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;font-family:inherit}
.cm{background:#f9fbfd;border-left:4px solid var(--nb);padding:10px;margin-bottom:10px;border-radius:4px;position:relative}
.del{position:absolute;top:10px;right:10px;background:none;border:none;color:#c53030;cursor:pointer;font-size:0.9rem;font-weight:bold}
.sealbox{margin:30px 0;padding:20px;background:#fff;border:2px solid var(--nd);border-radius:8px;}
.seal-grid{display:flex;justify-content:center;gap:50px;align-items:center;margin-top:20px;}
.seal{text-align:center;cursor:pointer;opacity:0.4;transition:0.3s;}
.seal.on{opacity:1;}
.seal img{width:130px;height:auto;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.st{font-size:0.85rem;font-weight:bold;margin-top:8px;color:#c53030;}
.seal.on .st{color:#2f855a;}
.ok{color:#2f855a;font-weight:bold}

@media print{
  body{background:#fff} 
  .noprint,.review-banner{display:none!important}
  .question,.review-panel{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
}
</style>
</head>
<body>

<div class="review-banner noprint">REVIEW VERSION - FACULTY MODE (Security Disabled)</div>

<form id="quiz-form" onsubmit="return false">
  <div id="quiz-container"></div>

<div id="report-card">

<!-- REVIEW PANEL -->

        <div class="st">Pending review</div>

  <h4 style="text-align:left">Add Observation</h4>

    <select id="crole"><option value="Dept. Reviewer">Dept. Reviewer</option><option value="C.A.E. Specialist">C.A.E. Specialist</option><option value="Lead Teacher">Lead Teacher</option></select>

  <div style="display:flex;gap:10px;margin-top:20px">

    <button type="button" class="act alt" onclick="cpTxt()">Copy to Clipboard</button>
    <button type="button" class="act alt" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),C=$('quiz-container'),items=[],loops=[];
let n=0;
const num=v=>parseFloat(String(v).replace(',','.'));
const near=(v,a,t)=>!isNaN(v)&&Math.abs(v-a)<=t;
const sec=t=>C.insertAdjacentHTML('beforeend',`<div class="sec">${t}</div>`);

function card(s,title,max,bd,html,grade){
  const d=document.createElement('div');
  d.className='question';
  const bdHtml = bd ? `<div class="breakdown"><b>Point Breakdown:</b> ${bd}</div>` : '';
  d.innerHTML=`<div class="hd"><b>${++n}. ${title}</b><span class="pts">${max} pts</span></div>${bdHtml}${html}`;
  C.appendChild(d);
  items.push({el:d,sec:s,max,grade});
  return d;
}
const numBox=(id,u)=>`<input type="text" class="ans" id="${id}" inputmode="decimal" autocomplete="off"> ${u}`;
(function loop(){loops.forEach(f=>f());requestAnimationFrame(loop)})();

/* ================= QUESTIONS ================= */
sec('Part I · Uniformly Accelerated Motion (20 pts)');
[["A car changes its velocity with constant acceleration. Time ($t$) is <b>absent</b> from the problem. Which equation must be used?",
  "$d = \\frac{v_f^2 - v_i^2}{2a}$",["$d = \\frac{v_f^2 - v_i^2}{2a}$", "$a = \\frac{v_f - v_i}{t}$", "$d = \\frac{(v_f + v_i)t}{2}$", "$d = v_i t + \\frac{a t^2}{2}$"]],
 ["A vehicle moves in the <b>positive direction ($+x$)</b> and <b>applies its brakes</b>. What is the sign of its acceleration?",
  "Negative",["Positive", "Negative", "Zero", "It cannot be determined"]],
 ["At the <b>highest point</b> of a ball thrown straight up (using $g = 9.8\\text{ m/s}^2$):",
  "Velocity is zero and acceleration is $9.8\\text{ m/s}^2$ downward",["Velocity is zero and acceleration is zero", "Velocity is zero and acceleration is $9.8\\text{ m/s}^2$ downward", "Velocity is $9.8\\text{ m/s}$ and acceleration is zero", "Velocity is maximum and acceleration is upward"]]
].forEach((q,k)=>mc('MUA',q,'m'+k));
function mc(s,q,name){
  const o=[...q[2]].sort(()=>Math.random()-.5);
  card(s,'Multiple Choice',1,'1 pt for selecting the single correct option.',`<p>${q[0]}</p>`+o.map(t=>`<label class="option"><input type="radio" name="${name}" value="${t}"> ${t}</label>`).join(''),
  ()=>{const c=document.querySelector(`input[name=${name}]:checked`);return c&&c.value===q[1]?1:0});
}
card('MUA','Acceleration from Rest',2,'1 pt for correct equation/setup, 1 pt for correct numerical value.',`<p>A scooter starts <b>from rest ($v_i = 0\\text{ m/s}$)</b> and reaches a velocity of <b>$v_f = 24.0\\text{ m/s}$</b> in <b>$t = 6.0\\text{ s}$</b>. Calculate its acceleration ($a$).</p><div class="scaffold-box"><b>Step-by-Step Guide:</b><br>1. <b>Given:</b> $v_i = 0\\text{ m/s}$, $v_f = 24.0\\text{ m/s}$, $t = 6.0\\text{ s}$<br>2. <b>Formula:</b> $a = \\frac{v_f - v_i}{t}$</div>${numBox('d1','m/s²')}`,()=>near(num($('d1').value),4.0,0.1)?2:0);

card('MUA','Time Calculation (MUA)',3,'3 pts for the correct time within ± 0.2 s.',`<p>A car accelerates at <b>$a = 2.5\\text{ m/s}^2$</b> from an initial velocity <b>$v_i = 10.0\\text{ m/s}$</b>. Calculate the time $t$ required for the car to cover exactly <b>$d = 105.0\\text{ m}$</b>.</p><div class="scaffold-box"><b>Step-by-Step Guide:</b><br>1. <b>Formula:</b> $d = v_i t + \\frac{a t^2}{2}$<br>2. <b>Substitute:</b> $105 = 10t + 1.25t^2$ $\\rightarrow$ Solve for $t$.</div><canvas id="mc1_static" width="520" height="150"></canvas><div class="canvas-desc"><b>Visual Support:</b> The scale shows a path from $0\\text{ m}$ to $120\\text{ m}$ with the car at origin and target line at $105.0\\text{ m}$.</div><div class="ctl" style="margin-top:12px">Calculated Time $t$: ${numBox('st1_ans','s')}</div>`,()=>near(num($('st1_ans').value),6.0,0.2)?3:0); (function(){const x=$('mc1_static').getContext('2d');x.fillStyle='#133565';x.fillRect(20,90,480,4);for(let m=0;m<=120;m+=20){const px=20+m*3.8;x.fillRect(px,90,2,8);x.font='11px Georgia';x.fillText(m+'m',px-8,112)}x.fillStyle='#215CAF';x.fillRect(20,65,30,20);x.fillStyle='#C69214';x.beginPath();x.arc(27,85,4,0,7);x.arc(43,85,4,0,7);x.fill();const tx=20+105*3.8;x.fillStyle='#c53030';x.setLineDash([5,5]);x.beginPath();x.moveTo(tx,40);x.lineTo(tx,90);x.stroke();x.setLineDash([]);x.font='bold 13px Georgia';x.fillText('Target: 105.0 m',tx-45,30)})();

card('MUA','Braking Distance',3,'1 pt for correct setup, 2 pts for correct stopping distance value.',`<p>A car moving at <b>$v_i = 20.0\\text{ m/s}$</b> applies its brakes with a constant deceleration of <b>$a = -4.0\\text{ m/s}^2$</b> until it comes to a <b>complete stop ($v_f = 0\\text{ m/s}$)</b>. Calculate its stopping distance ($d$).</p><div class="scaffold-box"><b>Step-by-Step Guide:</b><br>1. <b>Formula:</b> $v_f^2 = v_i^2 + 2ad$<br>2. <b>Rearrange:</b> $d = \\frac{v_f^2 - v_i^2}{2a}$</div>${numBox('d2','m')}`,()=>near(num($('d2').value),50.0,1.0)?3:0);

card('MUA','Complete MUA Equations',5,'1 pt for each correctly placed variable blank.',`<p>Drag each box to its correct space in the MUA formulas.</p><div class="scaffold-box"><b>Symbol Key:</b> $a$ = acceleration, $v_i$ = initial velocity, $d$ = distance, $t$ = time, $2$ = constant number.</div><div id="dd1"><div class="pool" id="pool1">${['a','2','d','t','v_i'].sort(()=>Math.random()-.5).map(k=>`<span class="chip" draggable="true" data-v="${k}">${k}</span>`).join('')}</div><div class="stm">$v_f = v_i +$ <span class="blank" data-a="a"></span> $\\cdot t$</div><div class="stm">$d = (v_f + v_i) \\cdot t / $ <span class="blank" data-a="2"></span></div><div class="stm">$d = v_i \\cdot t + a \\cdot t^2 / $ <span class="blank" data-a="2"></span></div><div class="stm">$v_f^2 = v_i^2 + 2 \\cdot a \\cdot$ <span class="blank" data-a="d"></span></div><div class="stm">$a = (v_f - v_i) / $ <span class="blank" data-a="t"></span></div></div>`,()=>[...document.querySelectorAll('#dd1 .blank')].filter(b=>b.firstChild&&b.firstChild.dataset.v===b.dataset.a).length);
(function(){const dd=$('dd1'),pool=$('pool1');let sel=null;const pick=c=>{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel')};const put=b=>{if(!sel)return;if(b.firstChild)pool.appendChild(b.firstChild);b.appendChild(sel);sel.classList.remove('sel');sel=null};dd.addEventListener('click',e=>{const c=e.target.closest('.chip'),b=e.target.closest('.blank');if(c)pick(c);else if(b)put(b);else if(sel&&e.target.closest('#pool1')){pool.appendChild(sel);sel.classList.remove('sel');sel=null}});dd.addEventListener('dragstart',e=>{pick(e.target);e.dataTransfer.setData('text','x')});dd.addEventListener('dragover',e=>e.preventDefault());dd.addEventListener('drop',e=>{e.preventDefault();const b=e.target.closest('.blank');if(b)put(b);else if(sel){pool.appendChild(sel);sel.classList.remove('sel');sel=null}})})();

{let res=null,run=null,tt=0,last=0;
card('MUA','Vertical Launch Simulation',4,'4 pts for accurate peak time within $\\pm 0.4\\text{ s}$ (2 pts partial credit within $\\pm 0.8\\text{ s}$).',`<p>A projectile is launched vertically upward with <b>$v_0 = 39.2\\text{ m/s}$</b> ($g = 9.8\\text{ m/s}^2$). <b>Calculate</b> the time required to reach the peak height ($t_{\\text{peak}} = \\frac{v_0}{g}$), type it, and press <b>Fire</b>.</p><div class="scaffold-box"><b>Tip:</b> First solve the formula on paper ($t = \\frac{39.2}{9.8}$) and type your result before testing.</div><canvas id="vc1" width="520" height="260"></canvas><div class="canvas-desc"><b>Visual Support:</b> Vertical height scale from $0\\text{ m}$ to $80\\text{ m}$.</div><div class="ctl" style="margin-top:12px">Time $t = $ ${numBox('vci','s')} <button type="button" class="act" id="vcf">Fire</button> <span id="vcm" class="mut"></span></div>`,()=>res===null?0:res<=0.4?4:res<=0.8?2:0);
const x=$('vc1').getContext('2d'),val=()=>num($('vci').value);
function draw(){x.clearRect(0,0,520,260);x.fillStyle='#133565';x.fillRect(0,240,520,20);x.font='12px Georgia';for(let h=0;h<=80;h+=20){const py=240-h*2.5;x.fillRect(40,py,6,1);x.fillText(h+'m',12,py+4)}if(run){const py=240-run.cy*2.5;x.fillStyle='#215CAF';x.beginPath();x.arc(260,py,6,0,7);x.fill()}}
function step(){if(!run)return;const now=performance.now();tt+=(now-last)/1000*2;last=now;const t=Math.min(tt,run.targetT);run.cy=Math.max(0,39.2*t-4.9*t*t);if(tt>=run.targetT){res=Math.abs(run.targetT-4.0);run=null;$('vcm').innerHTML=`Reached height ${(39.2*t-4.9*t*t).toFixed(1)} m at t = ${t.toFixed(1)} s. `+(res<=0.4?'<b style="color:#2f855a">Impact at Peak!</b>':'Missed peak.')}draw();if(run)requestAnimationFrame(step)}
$('vcf').onclick=()=>{if(run)return;const v=val();if(!(v>0)){alert('Enter a valid time in seconds.');return}$('vcf').disabled=true;run={targetT:v,cy:0};tt=0;last=performance.now();requestAnimationFrame(step)};draw()}

sec("Part II · Newton's Laws of Motion (25 pts)");
[["An object moves across a <b>frictionless surface</b> at a <b>constant velocity</b>. According to Newton's First Law, the <b>net force</b> acting on it is:","Zero",["Equal to its weight", "In the direction of motion", "Zero", "Opposite to its motion"]],
 ["If the <b>net force</b> acting on a block <b>doubles</b> while its mass <b>remains constant</b>, its acceleration:","Doubles",["Is halved", "Doubles", "Stays the same", "Quadruples"]],
 ["According to Newton's Third Law, the <b>reaction force</b> to the Earth pulling a book downward is:","The book pulling the Earth upward",["The table pushing the book upward", "The book pulling the Earth upward", "Friction acting on the book", "Air resistance pushing downward"]],
 ["A magician <b>quickly pulls</b> a tablecloth from under a set of dishes without moving them. Which of Newton's Laws primarily explains this phenomenon?","First Law (Inertia)",["First Law (Inertia)", "Second Law (Force and Acceleration)", "Third Law (Action and Reaction)", "Law of Universal Gravitation"]]
].forEach((q,k)=>mc('NL',q,'n'+k));

card('NL',"Resultant Force Vector",4,'4 pts for the correct magnitude of the resultant force within ± 0.5 N.',`<p>A box is pulled by two perpendicular ropes. One exerts a horizontal force <b>$F_x = 40.0\\text{ N}$</b> to the right, and the other a vertical force <b>$F_y = 30.0\\text{ N}$</b> upward. Calculate the magnitude of the <b>resultant force ($F_R$)</b> acting on the box.</p><div class="scaffold-box"><b>Step-by-Step Guide:</b> Use the Pythagorean theorem: $F_R = \\sqrt{F_x^2 + F_y^2}$</div><canvas id="fres_canvas" width="300" height="200" style="margin: 0 auto"></canvas><div class="canvas-desc" style="display:block;text-align:center"><b>Visual Support:</b> The diagram shows horizontal force $F_x = 40.0\\text{ N}$ rightward and vertical force $F_y = 30.0\\text{ N}$ upward.</div><div class="ctl" style="justify-content: center;margin-top:12px">Resultant Force $F_R$: ${numBox('fr_ans','N')}</div>`,()=>near(num($('fr_ans').value),50.0,0.5)?4:0); (function(){const x=$('fres_canvas').getContext('2d');x.fillStyle='#C69214';x.fillRect(50,100,40,40);x.strokeStyle='#215CAF';x.fillStyle='#215CAF';x.lineWidth=3;x.beginPath();x.moveTo(90,120);x.lineTo(190,120);x.stroke();x.beginPath();x.moveTo(190,120);x.lineTo(180,115);x.lineTo(180,125);x.fill();x.font='bold 14px Georgia';x.fillText('Fx = 40.0 N',110,110);x.strokeStyle='#c53030';x.fillStyle='#c53030';x.beginPath();x.moveTo(70,100);x.lineTo(70,20);x.stroke();x.beginPath();x.moveTo(70,20);x.lineTo(65,30);x.lineTo(75,30);x.fill();x.fillText('Fy = 30.0 N',85,50)})();

card('NL',"Newton's Second Law Calculation",2,'1 pt for setup, 1 pt for numerical value.',`<p>A net horizontal force <b>$F_{\\text{net}} = 120.0\\text{ N}$</b> acts on a <b>$30.0\\text{ kg}$</b> crate. Calculate its acceleration ($a$).</p><div class="scaffold-box"><b>Step-by-Step Guide:</b> $a = \\frac{F_{\\text{net}}}{m}$</div>${numBox('d3','m/s²')}`,()=>near(num($('d3').value),4.0,0.1)?2:0);

card('NL','Inclined Plane Weight Components',4,'2 pts for each correct component within ± 1.0 N.',`<p>A <b>$10.0\\text{ kg}$</b> block rests on a fixed ramp inclined at <b>$\\theta = 30^\\circ$</b> ($g = 9.8\\text{ m/s}^2$, Total Weight $w = 98.0\\text{ N}$). Calculate both weight components.</p><div class="scaffold-box"><b>Step-by-Step Guide:</b><br>1. Parallel force to ramp: $w_x = w \\cdot \\sin(\\theta)$<br>2. Perpendicular force to ramp: $w_y = w \\cdot \\cos(\\theta)$</div><canvas id="ic1_static" width="520" height="220"></canvas><div class="canvas-desc"><b>Visual Support:</b> Shows the ramp at $30^\\circ$ inclination with weight $98.0\\text{ N}$ split into $w_x$ (parallel) and $w_y$ (perpendicular).</div><div class="ctl" style="margin-top:12px">Parallel Force $w_x$: ${numBox('wx_ans','N')} <br> Perpendicular Force $w_y$: ${numBox('wy_ans','N')}</div>`,()=>(near(num($('wx_ans').value),49.0,1.0)?2:0)+(near(num($('wy_ans').value),84.9,1.0)?2:0)); (function(){const x=$('ic1_static').getContext('2d'),a=30,rad=a*Math.PI/180;x.fillStyle='#133565';x.beginPath();x.moveTo(50,180);x.lineTo(400,180);x.lineTo(400,180-350*Math.tan(rad));x.closePath();x.fill();const bx=220,by=180-170*Math.tan(rad);x.save();x.translate(bx,by);x.rotate(-rad);x.fillStyle='#C69214';x.fillRect(-25,-25,50,25);x.fillStyle='#c53030';x.strokeStyle='#c53030';x.lineWidth=2;x.beginPath();x.moveTo(0,-12.5);x.lineTo(-40,-12.5);x.stroke();x.beginPath();x.moveTo(-40,-12.5);x.lineTo(-30,-17.5);x.lineTo(-30,-7.5);x.fill();x.beginPath();x.moveTo(0,-12.5);x.lineTo(0,40);x.stroke();x.beginPath();x.moveTo(0,40);x.lineTo(-5,30);x.lineTo(5,30);x.fill();x.restore();x.fillStyle='#133565';x.font='13px Georgia';x.fillText('Angle θ = 30°',50,40);x.fillText('Weight w = 98.0 N',50,60)})();

card('NL','Ramp Dynamics Calculation',3,'a) 2 pts for correct parallel weight $w_x$, b) 1 pt for correct downhill acceleration $a$.',`<p>A <b>$15.0\\text{ kg}$</b> block slides down a frictionless ramp inclined at <b>$\\theta = 40^\\circ$</b> ($g = 9.8\\text{ m/s}^2$, Total Weight $w = 147.0\\text{ N}$). Calculate:</p><div class="scaffold-box"><b>Steps:</b> First find $w_x = w \\cdot \\sin(40^\\circ)$, then acceleration $a = \\frac{w_x}{m}$</div><p>a) The parallel weight component $w_x$: ${numBox('r1','N')}</p><p>b) The acceleration down the ramp ($a$): ${numBox('r2','m/s²')}</p>`,()=>(near(num($('r1').value),94.5,1.0)?2:0)+(near(num($('r2').value),6.3,0.2)?1:0));

card('NL',"Complete Newton's Equations",4,'1 pt for each correctly placed variable blank.',`<p>Drag each box to its correct space in the dynamics formulas.</p><div class="scaffold-box"><b>Symbol Key:</b> $a$ = acceleration, $\\sin$ = sine function, $\\cos$ = cosine function, $2$ = squared exponent (s²).</div><div id="dd2"><div class="pool" id="pool2">${['a','sin','cos','2'].sort(()=>Math.random()-.5).map(k=>`<span class="chip" draggable="true" data-v="${k}">${k}</span>`).join('')}</div><div class="stm">$F_{\\text{net}} = m \\cdot$ <span class="blank" data-a="a"></span></div><div class="stm">$w_x = m \\cdot g \\cdot$ <span class="blank" data-a="sin"></span> $\\theta$</div><div class="stm">$w_y = m \\cdot g \\cdot$ <span class="blank" data-a="cos"></span> $\\theta$</div><div class="stm">1 N = 1 kg · m/s<sup><span class="blank" data-a="2"></span></sup></div></div>`,()=>[...document.querySelectorAll('#dd2 .blank')].filter(b=>b.firstChild&&b.firstChild.dataset.v===b.dataset.a).length);
(function(){const dd=$('dd2'),pool=$('pool2');let sel=null;const pick=c=>{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel')};const put=b=>{if(!sel)return;if(b.firstChild)pool.appendChild(b.firstChild);b.appendChild(sel);sel.classList.remove('sel');sel=null};dd.addEventListener('click',e=>{const c=e.target.closest('.chip'),b=e.target.closest('.blank');if(c)pick(c);else if(b)put(b);else if(sel&&e.target.closest('#pool2')){pool.appendChild(sel);sel.classList.remove('sel');sel=null}});dd.addEventListener('dragstart',e=>{pick(e.target);e.dataTransfer.setData('text','x')});dd.addEventListener('dragover',e=>e.preventDefault());dd.addEventListener('drop',e=>{e.preventDefault();const b=e.target.closest('.blank');if(b)put(b);else if(sel){pool.appendChild(sel);sel.classList.remove('sel');sel=null}})})();

card('NL','Action-Reaction & Rocket Thrust',4,'a) 2 pts for correct net upward force, b) 2 pts for initial acceleration.',`<p>A model rocket engine pushes exhaust downward with <b>$120.0\\text{ N}$</b>. Rocket mass is <b>$2.0\\text{ kg}$</b> ($w = 19.6\\text{ N}$). Calculate:</p><div class="scaffold-box"><b>Steps:</b><br>a) $F_{\\text{net}} = F_{\\text{thrust}} - w = 120.0 - 19.6$<br>b) $a = \\frac{F_{\\text{net}}}{m}$</div><p>a) The net upward force $F_{\\text{net}}$: ${numBox('rk1','N')}</p><p>b) The initial upward acceleration ($a$): ${numBox('rk2','m/s²')}</p>`,()=>(near(num($('rk1').value),100.4,1.0)?2:0)+(near(num($('rk2').value),50.2,0.5)?2:0));

/* ================= REVIEW PANEL LOGIC ================= */
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qT=it=>it.el.querySelector('.hd b').textContent,qLabel=q=>q>0?'Question '+qT(items[q-1]):'General';

function evaluateExam(){
  const total=45,scs={MUA:0,NL:0};let score=0;
  items.forEach(it=>{
    const p=it.grade();score+=p;scs[it.sec]+=p;
    it.el.className='question '+(p>=it.max?'correct':p>0?'partial':'incorrect');
    it.el.querySelector('.pts').textContent=`${p} / ${it.max} pts`
  });
  $('rep-score').innerText=`Preview Score: ${score} / ${total}`;
  $('rep-sec').innerText=`MUA: ${scs.MUA} / 20 · Newton's Laws: ${scs.NL} / 25`;
  $('report-card').style.display='block';$('report-card').scrollIntoView({behavior:'smooth'})
}

/* Comments */
let CM=[];try{CM=JSON.parse(LS('rev9_cm')||'[]')}catch(e){}
$('cq').innerHTML='<option value="0">General (entire quiz)</option>'+items.map((it,i)=>`<option value="${i+1}">${esc(qT(it))}</option>`).join('');

items.forEach((it,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='act alt noprint';b.style.marginTop='8px';
  b.textContent='Comment on this question';
  b.onclick=()=>{
    $('cq').value=i+1;
    $('cbox').scrollIntoView({behavior:'smooth'});$('ctext').focus();
  };
  it.el.appendChild(b);
});

function renderCM(){
  $('ccount').textContent=CM.length;
  $('clist').innerHTML=CM.length?CM.map((c,i)=>`<div class="cm"><button class="del noprint" title="Delete" onclick="delCM(${i})">Delete</button><b>${esc(c.who)}</b> <small>(${esc(c.role)}) · ${esc(qLabel(c.q))} · ${esc(c.date)}</small><div>${esc(c.text).replace(/\n/g,'<br>')}</div></div>`).join(''):'<p class="mut">No comments registered yet.</p>';
}

function addCM(){
  const who=$('cwho').value.trim(),text=$('ctext').value.trim();
  if(!who||!text){alert('Please enter your name and observation.');return}
  CM.push({who,role:$('crole').value,q:+$('cq').value,text,date:new Date().toLocaleString('en-US')});
  LS('rev9_cm',JSON.stringify(CM));$('ctext').value='';renderCM();
}

function delCM(i){
  if(confirm('Delete this comment?')){
    CM.splice(i,1);LS('rev9_cm',JSON.stringify(CM));renderCM();
  }
}

/* Interactive Seals */
function apst(){
  const k=[...document.querySelectorAll('.seal input')].filter(c=>c.checked).length;
  $('apstat').textContent=k===2?'Approved with both seals':`Status: Pending ${k} of 2 seals approved`;
  $('apstat').className=k===2?'ok':'';
}
document.querySelectorAll('.seal').forEach(l=>{
  const cb=l.querySelector('input'),st=l.querySelector('.st'),k='rev9_'+cb.id;
  const show=()=>{
    l.classList.toggle('on',cb.checked);
    st.textContent=cb.checked?'Approved on '+cb.dataset.d:'Pending review';
    apst();
  };
  const v=LS(k);if(v){cb.checked=true;cb.dataset.d=v}
  cb.onchange=()=>{
    if(cb.checked)cb.dataset.d=new Date().toLocaleDateString('en-US');
    LS(k,cb.checked?cb.dataset.d:null);
    show();
  };
  show();
});

/* Export TXT */
function exportTxt(){
  const L=['REVIEW · I Quiz IV Quarter — 9th Grade Physics (45 pts)','Generated: '+new Date().toLocaleString('en-US'),'','SEAL APPROVALS'];
  document.querySelectorAll('.seal').forEach(l=>{
    const cb=l.querySelector('input');
    if(cb) L.push(`- ${l.dataset.n}: ${cb.checked?'APPROVED on '+cb.dataset.d:'Pending'}`);
  });
  L.push('','COMMENTS ('+CM.length+')');
  CM.forEach((c,i)=>L.push(`${i+1}. [${qLabel(c.q)}] ${c.who} (${c.role}) · ${c.date}`,'   '+c.text.replace(/\n/g,'\n   ')));
  return L.join('\n');
}
function dlTxt(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([exportTxt()],{type:'text/plain;charset=utf-8'}));
  a.download='Revision_I_Quiz_IV_Quarter_9th.txt';a.click();
}
function cpTxt(){
  navigator.clipboard.writeText(exportTxt()).then(()=>alert('Copied to clipboard.'),()=>alert('Could not copy; use "Download TXT".'));
}
renderCM();
</script>
</body>
